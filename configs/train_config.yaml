dataset_root: "/workspace/dataset/lerobot_dataset/crane_plus_pick_and_move_camera"
repo_id: "crane_plus_pick_and_move_camera"
# {policy} is replaced with the policy type below, so ACT and Diffusion do not overwrite each other
output_directory: "/workspace/checkpoints/train/crane_plus_pick_and_move_camera_{policy}"
config_path: "configs/crane_features_camera.py"
# Without camera (original):
# dataset_root: "/workspace/dataset/lerobot_dataset/crane_plus_pick_and_move"
# repo_id: "crane_plus_pick_and_move"
# output_directory: "/workspace/checkpoints/train/crane_plus_pick_and_move_{policy}"
# config_path: "configs/crane_features.py"

device: "cpu"
training_steps: 1000
log_freq: 10
# Save the model every save_freq steps, overwriting the previous one (null: only at the end)
save_freq: 500
num_workers: 2
batch_size: 8
learning_rate: 0.0001

# Policy to train: "act" or "diffusion". Only the section with the same name is used.
# delta_timestamps (which past/future frames are loaded) is derived from these parameters.
policy: "act"

act:
  # Predict chunk_size future actions (60 -> 3.0 s at 20 Hz)
  chunk_size: 60
  # Execute the first n_action_steps actions of each chunk (20 -> 1.0 s) before re-planning
  n_action_steps: 60

diffusion:
  # Use the current and previous observation (0.05 s apart at 20 Hz)
  n_obs_steps: 2
  # Number of predicted actions; must be a multiple of 8
  horizon: 16
  # Must be <= horizon - n_obs_steps + 1
  n_action_steps: 8
  # Random crop of the 240x320 images during training (the default 84x84 would keep only a small part)
  crop_shape: [216, 288]
  # Fewer denoising steps at inference so that it keeps up with the 20 Hz control loop
  noise_scheduler_type: "DDIM"
  num_inference_steps: 10
  pretrained_backbone_weights: "ResNet18_Weights.IMAGENET1K_V1"
  use_group_norm: false
