dataset_root: "/workspace/dataset/lerobot_dataset/crane_plus_pick_and_move_camera"
repo_id: "crane_plus_pick_and_move_camera"
output_directory: "/workspace/checkpoints/train/crane_plus_pick_and_move_camera_act"
config_path: "configs/crane_features_camera.py"
# Without camera (original): also remove observation.images.camera from delta_timestamps below
# dataset_root: "/workspace/dataset/lerobot_dataset/crane_plus_pick_and_move"
# repo_id: "crane_plus_pick_and_move"
# output_directory: "/workspace/checkpoints/train/crane_plus_pick_and_move_act"
# config_path: "configs/crane_features.py"

device: "cpu"
training_steps: 1000
log_freq: 10
num_workers: 2
batch_size: 8
chunk_size: 60
# Execute the first 8 actions of each predicted chunk (0.4 s at 20 Hz) before re-planning
n_action_steps: 20
learning_rate: 0.0001
delta_timestamps:
  observation.environment_state: [0.0]
  observation.state: [0.0]
  observation.images.camera: [0.0]
  # action is generated by train.py from chunk_size and the dataset fps:
  # [0, 1/fps, ..., (chunk_size - 1)/fps] (e.g. chunk_size 16 at 20 Hz -> 0.0 .. 0.75 s)
